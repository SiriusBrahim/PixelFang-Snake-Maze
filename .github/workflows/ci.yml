name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref || github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply semver-compatible dependency security fixes
        run: |
          npm audit fix --package-lock-only --ignore-scripts
          npm ci
      - name: Report dependency audit details
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/npm-audit.json', 'utf8'));
          const vulnerabilities = report.vulnerabilities || {};
          console.log('npm audit summary:', JSON.stringify(report.metadata?.vulnerabilities || {}));
          for (const [name, item] of Object.entries(vulnerabilities)) {
            console.log(JSON.stringify({
              name,
              severity: item.severity,
              direct: item.isDirect,
              range: item.range,
              fixAvailable: item.fixAvailable,
              advisories: (item.via || []).filter((entry) => typeof entry === 'object').map((entry) => ({
                title: entry.title,
                url: entry.url,
                range: entry.range,
                severity: entry.severity,
              })),
            }));
          }
          NODE
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Upload proposed dependency lockfile
        uses: actions/upload-artifact@v6
        with:
          name: npm-audit-remediated-lockfile
          path: package-lock.json
          if-no-files-found: error
      - name: Persist remediated lockfile to the same-repository PR branch
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already up to date."
            exit 0
          fi
          git commit -m "chore(deps): fix npm audit vulnerabilities"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
