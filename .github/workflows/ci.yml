name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Report and enforce dependency audit
        run: |
          npm audit --audit-level=moderate --json > "$RUNNER_TEMP/npm-audit.json" || audit_status=$?
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/npm-audit.json', 'utf8'));
          const vulnerabilities = report.vulnerabilities || {};
          console.log('npm audit summary:', JSON.stringify(report.metadata?.vulnerabilities || {}));
          for (const [name, item] of Object.entries(vulnerabilities)) {
            console.log(JSON.stringify({
              name,
              severity: item.severity,
              direct: item.isDirect,
              range: item.range,
              fixAvailable: item.fixAvailable,
              via: item.via,
            }));
          }
          NODE
          if [ "${audit_status:-0}" -ne 0 ]; then
            exit "$audit_status"
          fi
      - run: npm test
      - run: npm run lint
      - run: npm run build
